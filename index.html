<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf8ef">
<title>2048 · 锤子版</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    background: #faf8ef;
    color: #776e65;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    overscroll-behavior: contain;
  }
  .game { width: 100%; max-width: 480px; display: flex; flex-direction: column; }

  header { width: 100%; margin-bottom: 12px; }
  .title-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  h1 { margin: 0; font-size: 48px; color: #776e65; line-height: 1; }
  .actions { display: flex; gap: 8px; }
  .actions button {
    border: none; border-radius: 6px; background: #8f7a66; color: #fff;
    font-size: 14px; font-weight: bold; padding: 10px 14px; cursor: pointer;
  }
  .actions button:hover { background: #7f6a56; }
  .actions button.primary { background: #f67c5f; }
  .actions button.primary:hover { background: #e05c46; }

  .scores { display: flex; gap: 8px; width: 100%; }
  .box {
    background: #bbada0; border-radius: 6px; padding: 6px 8px;
    display: flex; flex-direction: column; align-items: center;
    flex: 1; min-width: 0;
  }
  .box .label { font-size: 12px; color: #eee4da; font-weight: bold; }
  .box .value { font-size: 22px; color: #fff; font-weight: bold; line-height: 1.15; }
  .box button {
    margin-top: 2px; border: none; border-radius: 4px; background: #8f7a66;
    color: #fff; font-size: 13px; font-weight: bold; padding: 6px 6px;
    cursor: pointer; width: 100%; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .box button:hover:not(.disabled) { background: #7f6a56; }
  .box button.active { background: #f67c5f; }
  .box button.disabled { background: #8f7a66; color: #cdc1b4; cursor: not-allowed; }
  .box button.player { background: #6f5f4e; font-size: 13px; }
  .box button.player:hover { background: #5f4f3e; }

  .how { margin: 0 0 10px; font-size: 14px; color: #776e65; }
  .how strong { color: #f67c5f; }

  .board-wrap { position: relative; width: 100%; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    background: #bbada0;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    aspect-ratio: 1 / 1;
    touch-action: none;
  }
  .cell {
    background: #cdc1b4;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #776e65;
    font-size: clamp(24px, 9vw, 48px);
    transition: background 0.12s ease;
  }
  .cell.sz-m { font-size: clamp(18px, 7vw, 36px); }
  .cell.sz-s { font-size: clamp(14px, 5.5vw, 28px); }

  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .cell.tile-new { animation: pop 0.18s ease-out; }

  .board.targeting .cell { cursor: pointer; }
  .board.targeting .cell:hover { outline: 2px solid #f67c5f; outline-offset: -2px; }

  .overlay {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(238, 228, 218, 0.74);
    border-radius: 8px;
    pointer-events: none;
    z-index: 2;
    text-align: center;
    padding: 20px;
  }
  .overlay-title { font-size: 34px; font-weight: bold; color: #776e65; }
  .overlay-sub { font-size: 15px; color: #776e65; margin: 8px 0 14px; }
  .overlay button {
    pointer-events: auto;
    border: none; border-radius: 6px; background: #8f7a66; color: #fff;
    font-size: 16px; font-weight: bold; padding: 10px 22px; margin: 4px;
    cursor: pointer;
  }
  .overlay button:hover { background: #7f6a56; }

  .hint { font-size: 13px; color: #776e65; margin-top: 14px; text-align: center; }
  .hint.warn { color: #f65e3b; font-weight: bold; }

  /* ---- 弹窗（昵称 / 排行榜） ---- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    z-index: 10; padding: 20px;
  }
  .modal {
    background: #faf8ef; border-radius: 12px; padding: 22px;
    width: 100%; max-width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .modal h2 { margin: 0 0 6px; font-size: 22px; color: #776e65; }
  .modal .sub { margin: 0 0 14px; font-size: 13px; color: #a89f92; }
  .modal input {
    width: 100%; padding: 10px 12px; font-size: 16px; border: 2px solid #cdc1b4;
    border-radius: 6px; outline: none; color: #776e65; background: #fff;
  }
  .modal input:focus { border-color: #f67c5f; }
  .modal .btns { display: flex; gap: 10px; margin-top: 16px; }
  .modal .btns button {
    flex: 1; border: none; border-radius: 6px; padding: 10px; font-size: 15px;
    font-weight: bold; cursor: pointer;
  }
  .modal .btns .ok { background: #f67c5f; color: #fff; }
  .modal .btns .ok:hover { background: #e05c46; }
  .modal .btns .cancel { background: #bbada0; color: #fff; }
  .modal .btns .cancel:hover { background: #a89f92; }

  .lb-list { max-height: 46vh; overflow-y: auto; margin-top: 4px; }
  .lb-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 6px;
    border-bottom: 1px solid #eee4da;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { width: 34px; text-align: center; font-size: 16px; font-weight: bold; color: #776e65; }
  .lb-name { flex: 1; font-size: 16px; color: #776e65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-size: 18px; font-weight: bold; color: #f67c5f; }
  .lb-empty { text-align: center; color: #a89f92; padding: 20px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="game">
  <header>
    <div class="title-row">
      <h1>2048</h1>
      <div class="actions">
        <button id="new-game">新游戏</button>
        <button id="lb-btn" class="primary">🏆 排行榜</button>
      </div>
    </div>
    <div class="scores">
      <div class="box">
        <span class="label">分数</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="box">
        <span class="label">最高</span>
        <span class="value" id="best">0</span>
      </div>
      <div class="box">
        <span class="label">道具</span>
        <button id="hammer">锤子 ×3</button>
      </div>
      <div class="box">
        <span class="label">玩家</span>
        <button id="player-name" class="player" title="点击设置昵称">未命名</button>
      </div>
    </div>
  </header>

  <p class="how">合并相同数字，凑出 <strong>2048</strong>！</p>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlay-title"></div>
      <div class="overlay-sub" id="overlay-sub"></div>
      <div>
        <button id="overlay-restart">再来一局</button>
        <button id="overlay-continue">继续游戏</button>
      </div>
    </div>
  </div>

  <p class="hint" id="hint"></p>
</div>

<!-- 昵称弹窗 -->
<div class="modal-mask" id="name-modal">
  <div class="modal">
    <h2>注册昵称</h2>
    <p class="sub">不需要密码，输入一个名字即可开始记录你的分数</p>
    <input id="name-input" type="text" maxlength="12" placeholder="输入昵称（最多 12 字）">
    <div class="btns">
      <button class="cancel" id="name-skip">跳过</button>
      <button class="ok" id="name-ok">确定</button>
    </div>
  </div>
</div>

<!-- 排行榜弹窗 -->
<div class="modal-mask" id="lb-modal">
  <div class="modal">
    <h2>🏆 排行榜</h2>
    <p class="sub">前 20 名（同一昵称只保留最高分）</p>
    <div class="lb-list" id="lb-list"></div>
    <div class="btns">
      <button class="ok" id="lb-close">关闭</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var SIZE = 4;
  var START_TILES = 2;
  var WIN_VALUE = 2048;
  var HAMMERS = 3;
  var BEST_KEY = "best2048";

  // 排行榜存储：getpantry.cloud 共享后端（跨用户共享前 20 名）。
  var PLAYER_KEY = "player2048";
  var TOP_N = 20;
  var REMOTE_URL = "https://getpantry.cloud/apiv1/pantry/aaa8b7ff-7c89-4157-a193-223d554ef589/basket/game2048";

  var COLORS = {
    0:    { bg: "#cdc1b4", fg: "#cdc1b4" },
    2:    { bg: "#eee4da", fg: "#776e65" },
    4:    { bg: "#ede0c8", fg: "#776e65" },
    8:    { bg: "#f2b179", fg: "#f9f6f2" },
    16:   { bg: "#f59563", fg: "#f9f6f2" },
    32:   { bg: "#f67c5f", fg: "#f9f6f2" },
    64:   { bg: "#f65e3b", fg: "#f9f6f2" },
    128:  { bg: "#edcf72", fg: "#f9f6f2" },
    256:  { bg: "#edcc61", fg: "#f9f6f2" },
    512:  { bg: "#edc850", fg: "#f9f6f2" },
    1024: { bg: "#edc53f", fg: "#f9f6f2" },
    2048: { bg: "#edc22e", fg: "#f9f6f2" }
  };
  var BIG = { bg: "#3c3a32", fg: "#f9f6f2" };

  var boardEl   = document.getElementById("board");
  var scoreEl   = document.getElementById("score");
  var bestEl    = document.getElementById("best");
  var hammerBtn = document.getElementById("hammer");
  var hintEl    = document.getElementById("hint");
  var overlayEl = document.getElementById("overlay");
  var overlayTitle  = document.getElementById("overlay-title");
  var overlaySub    = document.getElementById("overlay-sub");
  var overlayRestart  = document.getElementById("overlay-restart");
  var overlayContinue = document.getElementById("overlay-continue");
  var newGameBtn = document.getElementById("new-game");

  var playerNameBtn = document.getElementById("player-name");
  var lbBtn = document.getElementById("lb-btn");
  var nameModal = document.getElementById("name-modal");
  var nameInput = document.getElementById("name-input");
  var nameOk = document.getElementById("name-ok");
  var nameSkip = document.getElementById("name-skip");
  var lbModal = document.getElementById("lb-modal");
  var lbList = document.getElementById("lb-list");
  var lbClose = document.getElementById("lb-close");

  var board, score, best, hammerCount, hammerActive, won, gameOver;

  best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;

  function reset() {
    board = Array.from({ length: SIZE }, function () { return Array(SIZE).fill(0); });
    score = 0;
    hammerCount = HAMMERS;
    hammerActive = false;
    won = false;
    gameOver = false;
    hideOverlay();
    for (var i = 0; i < START_TILES; i++) spawn();
    render();
    updateScores();
    updateHammer();
    updateHint();
  }

  function spawn() {
    var empty = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (board[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return null;
    var pos = empty[Math.floor(Math.random() * empty.length)];
    board[pos[0]][pos[1]] = Math.random() < 0.1 ? 4 : 2;
    return pos;
  }

  function slide(row) {
    var line = row.filter(function (v) { return v !== 0; });
    var gained = 0;
    for (var i = 0; i < line.length - 1; i++) {
      if (line[i] === line[i + 1]) {
        line[i] *= 2;
        gained += line[i];
        line.splice(i + 1, 1);
      }
    }
    while (line.length < SIZE) line.push(0);
    return { line: line, gained: gained };
  }

  function move(direction) {
    if (gameOver || overlayShowing()) return;
    var before = board.map(function (r) { return r.slice(); });
    var gained = 0;

    if (direction === "left") {
      for (var r = 0; r < SIZE; r++) {
        var res = slide(board[r]);
        board[r] = res.line; gained += res.gained;
      }
    } else if (direction === "right") {
      for (var r2 = 0; r2 < SIZE; r2++) {
        var res2 = slide(board[r2].slice().reverse());
        board[r2] = res2.line.reverse(); gained += res2.gained;
      }
    } else if (direction === "up") {
      for (var c = 0; c < SIZE; c++) {
        var col = [board[0][c], board[1][c], board[2][c], board[3][c]];
        var res3 = slide(col);
        gained += res3.gained;
        for (var r3 = 0; r3 < SIZE; r3++) board[r3][c] = res3.line[r3];
      }
    } else if (direction === "down") {
      for (var c2 = 0; c2 < SIZE; c2++) {
        var col2 = [board[3][c2], board[2][c2], board[1][c2], board[0][c2]];
        var res4 = slide(col2);
        gained += res4.gained;
        for (var r4 = 0; r4 < SIZE; r4++) board[3 - r4][c2] = res4.line[r4];
      }
    } else {
      return;
    }

    if (JSON.stringify(before) === JSON.stringify(board)) return;

    score += gained;
    if (score > best) {
      best = score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    if (hammerActive) {
      hammerActive = false;
      updateHammer();
      updateHint();
    }
    var spawnedCell = spawn();
    render(spawnedCell);
    updateScores();

    if (!won && board.some(function (r) { return r.indexOf(WIN_VALUE) !== -1; })) {
      won = true;
      showWin();
    } else if (isGameOver()) {
      gameOver = true;
      showGameOver();
      var nm = getPlayerName();
      if (nm) {
        overlaySub.textContent = "分数提交中…";
        submitScore(nm, score).then(function (ok) {
          if (overlayShowing()) {
            var sub = ok ? "分数已记录到排行榜！" : "分数提交失败，请稍后重试。";
            if (hammerCount > 0) sub += " 点上方“锤子”再点一个方块，可消除它继续！";
            overlaySub.textContent = sub;
          }
        });
      } else if (overlayShowing()) {
        overlaySub.textContent = "没有可移动的方块了。设置昵称后才会记录分数。";
      }
    }
  }

  function isGameOver() {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++) {
        if (board[r][c] === 0) return false;
        if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return false;
        if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return false;
      }
    return true;
  }

  function render(spawnedCell) {
    boardEl.innerHTML = "";
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = board[r][c];
        var cell = document.createElement("div");
        cell.className = "cell";
        cell.setAttribute("data-r", r);
        cell.setAttribute("data-c", c);
        if (v) {
          cell.textContent = v;
          var col = COLORS[v] || BIG;
          cell.style.background = col.bg;
          cell.style.color = col.fg;
          if (v >= 1000) cell.classList.add("sz-s");
          else if (v >= 100) cell.classList.add("sz-m");
        }
        if (spawnedCell && spawnedCell[0] === r && spawnedCell[1] === c) {
          cell.classList.add("tile-new");
        }
        boardEl.appendChild(cell);
      }
    }
  }

  function updateScores() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function updateHammer() {
    hammerBtn.classList.toggle("active", hammerActive && hammerCount > 0);
    hammerBtn.disabled = hammerCount <= 0;
    hammerBtn.classList.toggle("disabled", hammerCount <= 0);
    hammerBtn.textContent = "锤子 ×" + hammerCount;
    boardEl.classList.toggle("targeting", hammerActive && hammerCount > 0);
  }

  function updateHint() {
    if (hammerActive) {
      hintEl.textContent = "已拿起锤子：点击棋盘上的方块将其消除（再点“锤子”取消）";
      hintEl.classList.add("warn");
    } else {
      hintEl.textContent = "方向键 / WASD 移动 · 手机可滑动 · R 重开 · 锤子：消除一个方块";
      hintEl.classList.remove("warn");
    }
  }

  function toggleHammer() {
    if (hammerCount <= 0) return;
    hammerActive = !hammerActive;
    updateHammer();
    updateHint();
  }

  boardEl.addEventListener("click", function (e) {
    var cell = e.target.closest ? e.target.closest(".cell") : null;
    if (!cell || !hammerActive || hammerCount <= 0) return;
    var r = +cell.getAttribute("data-r");
    var c = +cell.getAttribute("data-c");
    if (board[r][c] === 0) return;
    board[r][c] = 0;
    hammerCount--;
    hammerActive = false;
    gameOver = false;
    hideOverlay();
    render();
    updateHammer();
    updateHint();
  });

  function overlayShowing() {
    return overlayEl.style.display !== "none";
  }
  function showOverlay(title, sub, showContinue) {
    overlayTitle.textContent = title;
    overlaySub.textContent = sub;
    overlayContinue.style.display = showContinue ? "" : "none";
    overlayEl.style.display = "flex";
  }
  function hideOverlay() {
    overlayEl.style.display = "none";
  }
  function showWin() {
    showOverlay("🎉 你赢了！", "已经合成 2048，继续挑战更大的数字吧", true);
  }
  function showGameOver() {
    var sub = "没有可移动的方块了。";
    if (hammerCount > 0) sub += " 点上方“锤子”再点一个方块，可消除它继续！";
    showOverlay("游戏结束", sub, false);
  }

  // ================= 昵称 + 排行榜（本地） =================
  function getPlayerName() {
    try { return localStorage.getItem(PLAYER_KEY) || ""; } catch (e) { return ""; }
  }
  function setPlayerName(name) {
    try { localStorage.setItem(PLAYER_KEY, name); } catch (e) {}
  }
  function updatePlayerDisplay() {
    var n = getPlayerName();
    playerNameBtn.textContent = n ? n : "未命名";
    playerNameBtn.title = n ? "点击修改昵称" : "点击设置昵称";
  }

  // 从远程读取排行榜（返回 scores 数组）
  function fetchScores() {
    return fetch(REMOTE_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        var scores = data && data.scores;
        var arr = [];
        if (Array.isArray(scores)) {
          scores.forEach(function (e) {
            if (e && e.name) arr.push({ name: e.name, score: e.score || 0, ts: e.ts || 0 });
          });
        } else if (scores && typeof scores === "object") {
          for (var k in scores) {
            if (Object.prototype.hasOwnProperty.call(scores, k)) {
              var v = scores[k];
              arr.push({ name: k, score: (v && v.score) || 0, ts: (v && v.ts) || 0 });
            }
          }
        }
        return arr;
      });
  }

  // 提交分数：若该昵称已有更高/相等分则跳过；否则按昵称 upsert 到远程
  function submitScore(name, scoreValue) {
    if (!name || scoreValue <= 0) return Promise.resolve(false);
    return fetchScores()
      .then(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].name === name && entries[i].score >= scoreValue) {
            return true; // 已有更高/相等分，无需写入
          }
        }
        var body = { scores: {} };
        body.scores[name] = { score: scoreValue, ts: Date.now() };
        return fetch(REMOTE_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return true;
        });
      })
      .catch(function () { return false; });
  }

  function renderLeaderboard() {
    lbList.innerHTML = '<div class="lb-empty">加载中…</div>';
    fetchScores().then(function (entries) {
      entries.sort(function (a, b) { return b.score - a.score; });
      var seen = {};
      var unique = [];
      for (var i = 0; i < entries.length; i++) {
        if (!seen[entries[i].name]) { seen[entries[i].name] = true; unique.push(entries[i]); }
      }
      unique = unique.slice(0, TOP_N);
      lbList.innerHTML = "";
      if (!unique.length) {
        var empty = document.createElement("div");
        empty.className = "lb-empty";
        empty.textContent = "还没有记录，快去玩一局吧！";
        lbList.appendChild(empty);
        return;
      }
      unique.forEach(function (e, i) {
        var row = document.createElement("div");
        row.className = "lb-row";
        var medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
        var rank = document.createElement("span");
        rank.className = "lb-rank";
        rank.textContent = medal;
        var nameSpan = document.createElement("span");
        nameSpan.className = "lb-name";
        nameSpan.textContent = e.name;
        var scoreSpan = document.createElement("span");
        scoreSpan.className = "lb-score";
        scoreSpan.textContent = e.score;
        row.appendChild(rank);
        row.appendChild(nameSpan);
        row.appendChild(scoreSpan);
        lbList.appendChild(row);
      });
    }).catch(function () {
      lbList.innerHTML = '<div class="lb-empty">排行榜暂时加载失败，请稍后重试</div>';
    });
  }

  // ---- 弹窗 ----
  function showNameModal() {
    nameInput.value = getPlayerName();
    nameModal.style.display = "flex";
    setTimeout(function () { nameInput.focus(); }, 50);
  }
  function hideNameModal() { nameModal.style.display = "none"; }
  function confirmName() {
    var n = nameInput.value.trim().slice(0, 12);
    if (n) { setPlayerName(n); updatePlayerDisplay(); }
    hideNameModal();
  }
  function showLeaderboard() {
    renderLeaderboard();
    lbModal.style.display = "flex";
  }
  function hideLeaderboard() { lbModal.style.display = "none"; }

  // ================= 输入绑定 =================
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(k) !== -1) {
      e.preventDefault();
      move(k.replace("Arrow", "").toLowerCase());
    } else if (k === "w" || k === "W") move("up");
    else if (k === "s" || k === "S") move("down");
    else if (k === "a" || k === "A") move("left");
    else if (k === "d" || k === "D") move("right");
    else if (k === "r" || k === "R") reset();
  });

  var touchX = null, touchY = null;
  document.addEventListener("touchstart", function (e) {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    touchX = touchY = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
  }, { passive: true });

  hammerBtn.addEventListener("click", toggleHammer);
  newGameBtn.addEventListener("click", reset);
  overlayRestart.addEventListener("click", reset);
  overlayContinue.addEventListener("click", hideOverlay);

  playerNameBtn.addEventListener("click", showNameModal);
  lbBtn.addEventListener("click", showLeaderboard);
  lbClose.addEventListener("click", hideLeaderboard);
  nameOk.addEventListener("click", confirmName);
  nameSkip.addEventListener("click", hideNameModal);
  nameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); confirmName(); }
  });
  lbModal.addEventListener("click", function (e) {
    if (e.target === lbModal) hideLeaderboard();
  });
  nameModal.addEventListener("click", function (e) {
    if (e.target === nameModal) hideNameModal();
  });

  // 首次进入：没有昵称时弹窗提醒
  updatePlayerDisplay();
  reset();
  if (!getPlayerName()) {
    setTimeout(showNameModal, 300);
  }
})();
</script>
</body>
</html>
